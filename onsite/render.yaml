# Render Blueprint. Push this repo to GitHub, then: Render dashboard → New → Blueprint → pick the repo.
services:
  - type: web
    name: onsite
    runtime: node
    region: singapore          # closest Render region to Sydney
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # paste the Neon pooled connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        value: https://onsite.onrender.com
      - key: DEV_SHOW_OTP
        value: "0"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: QPAY_BASE_URL
        value: https://merchant.qpay.mn/v2
      - key: QPAY_USERNAME
        sync: false            # paste in the Render dashboard, never in this file
      - key: QPAY_PASSWORD
        sync: false
      - key: QPAY_INVOICE_CODE
        sync: false
      - key: QPAY_CALLBACK_SECRET
        generateValue: true
      # SafeWork NSW White Card register (api.nsw.gov.au). Without these every card is checked by hand.
      - key: WHITE_CARD_API_KEY
        sync: false
      - key: WHITE_CARD_API_SECRET
        sync: false
      - key: WHITE_CARD_AUTH_HEADER
        sync: false            # optional: the portal's ready-made "Basic …" value
      # Register calls a day for the whole app: 70 ≈ 2,100 of the free tier's 2,500 a month.
      - key: WHITECARD_CHECKS_PER_DAY
        value: "70"
      # Web push for shift alerts. Generate once with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false            # a contact address push services can reach you on (mailto: or https:)
  # Every 4 min: widens matching on stale shifts AND keeps the Neon compute awake (free tier sleeps after 5 min idle).
  - type: cron
    name: onsite-matching-expand
    runtime: node
    region: singapore
    schedule: "*/4 * * * *"
    buildCommand: "true"
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/expand"   # not in the URL: query strings land in logs
    envVars:
      - key: APP_URL
        value: https://onsite.onrender.com
      - key: CRON_SECRET
        sync: false
